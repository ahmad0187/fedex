name: FedEx Pickup Manifest Monitor

on:
  schedule:
    # GitHub's scheduler is best-effort, not to-the-second -- runs can slip a few
    # minutes under load. Fine for a 60-minute warning window.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed to commit the updated dedup-state file back to the repo

concurrency:
  group: fedex-monitor
  cancel-in-progress: false   # never cancel a run that's mid-cycle for a newer one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Only needed if you're using the saved-session approach instead of
      # FEDEX_USERNAME/FEDEX_PASSWORD below. Harmless to leave this step in either way.
      - name: Write saved login session (if FEDEX_STORAGE_STATE secret is set)
        env:
          FEDEX_STORAGE_STATE: ${{ secrets.FEDEX_STORAGE_STATE }}
        run: |
          if [ -n "$FEDEX_STORAGE_STATE" ]; then
            echo "$FEDEX_STORAGE_STATE" > storage_state.json
          fi

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FEDEX_USERNAME: ${{ secrets.FEDEX_USERNAME }}
          FEDEX_PASSWORD: ${{ secrets.FEDEX_PASSWORD }}
        run: python fedex_monitor.py

      # state.db is how the script avoids re-alerting on the same stop every 15
      # minutes. GitHub Actions runners are thrown away after each run, so the only
      # way to keep that memory between runs is to commit it back to the repo. It
      # holds no FedEx data -- just (pu_list, puid, status, timestamp) rows.
      - name: Persist monitor state (dedup DB)
        if: always()
        run: |
          git config user.name "fedex-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.db
          git diff --cached --quiet || git commit -m "chore: update monitor state [skip ci]"
          git push
